; ============================================================
;  PoisonCore-Cardputer  |  platformio.ini
;  Plataforma: M5Stack Cardputer ADV (ESP32-S3FN8) + Cap LoRa-1262
;  Objetivo: MeshCore (NO Meshtastic)  -  sync word 0x12 (PRIVATE)
;
;  Board ID: se usa "esp32-s3-devkitc-1" (generico ESP32-S3), que es
;  el metodo oficial confirmado por M5Stack para la Cardputer ADV.
; ============================================================

[env:cardputer-adv]
platform  = espressif32 @ 6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Flash / memoria (ESP32-S3FN8 = 8MB Flash, 2MB PSRAM) ---
board_build.flash_mode    = qio
board_build.flash_size    = 8MB
board_build.partitions    = default_8MB.csv
board_upload.flash_size   = 8MB

; --- Upload / Monitor ---
upload_speed = 1500000
upload_port  = /dev/ttyACM0
monitor_speed   = 115200
monitor_port    = /dev/ttyACM0
monitor_filters = esp32_exception_decoder, colorize

; --- Build flags ---
;  -DESP32S3 / USB CDC / PSRAM: igual que PoisonMesh (necesarios en S3)
;  -DED25519_NO_SEED=1: neutraliza seed.c (usa /dev/urandom, no aplica en MCU);
;    el seed se genera con esp_random() en pc_identity.cpp
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DED25519_NO_SEED=1

; --- Librerias ---
lib_deps =
    ; Hardware M5Stack
    m5stack/M5Unified @ ^0.2.4
    m5stack/M5GFX     @ ^0.2.4
    ; Teclado Cardputer
    https://github.com/m5stack/M5Cardputer
    ; Radio SX1262
    jgromes/RadioLib  @ ^6.6.0
    ; Cripto: AES128 + SHA256 (mismo backend que MeshCore)
    rweather/Crypto   @ ^0.4.0

; NOTA: la identidad Ed25519 (firma/ECDH) usa la lib bundle en lib/ed25519/,
; portada de MeshCore. PlatformIO la compila automaticamente (LDF).
